services:
  mongodb:
    image: mongo:7
    container_name: trimly-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: trimly_admin
      MONGO_INITDB_ROOT_PASSWORD: trimly_secret_2024
      MONGO_INITDB_DATABASE: trimly
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
